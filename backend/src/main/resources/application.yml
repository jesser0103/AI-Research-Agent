spring:
  application:
    name: spring-boot-ai-research-agent
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://localhost:5432/ai_reseaarch_agent
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database: postgresql



proxy:
  host: sss
  port: 99
  username: 000
  password: 000
  user-agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
#Anthropic config
anthropic:
  api-key:  ${ANTHROPIC_API_KEY:}
  model:  claude-haiku-4-5-20251001
  base-url: https://api.anthropic.com/v1
  version:  "2023-06-01"
#Scraping config
scrapping:
  cron: "0 0 */3 * * *"
  reddit:
    subreddits: technology,artificial,MachineLearning,startups,Saas
    post-per-subreddit: 25
  hackernews:
    top-stories-count: 30
  producthunt:
    posts-count: 20


